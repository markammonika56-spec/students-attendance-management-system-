<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .present {
            background: #16a34a;
            color: white;
        }

        .absent {
            background: #dc2626;
            color: white;
        }

        .search {
            width: 90%;
            max-width: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #e5e7eb;
        }

        .percentage {
            font-weight: bold;
        }

        @media(max-width: 600px) {
            table {
                font-size: 13px;
            }

            input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Attendance Management System</h1>
    <p>BCA Mini Project | HTML, CSS & JavaScript</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add Student</h2>

        <input type="text" id="rollNo" placeholder="Enter Roll Number">
        <input type="text" id="studentName" placeholder="Enter Student Name">

        <button class="add-btn" onclick="addStudent()">
            Add Student
        </button>
    </div>

    <div class="card">
        <h2>Search Student</h2>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="Search by name or roll number"
            onkeyup="displayStudents()"
        >

        <table>
            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Attendance %</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

}
